<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="towmate_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>towmate_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- Web OAuth client ID for Google Sign-In (public, same value as
       GOOGLE_CLIENT_ID in env/production.json). google_sign_in_web reads it
       when the app is run without --dart-define GOOGLE_CLIENT_ID; without it
       the Google button never leaves "Getting ready". Each dev origin (e.g.
       http://localhost:5000) must be an Authorized JavaScript origin of this
       client in Google Cloud Console. -->
  <meta name="google-signin-client_id" content="191576105651-878s9u31fll8hj4rqetrhpv5tg77iujt.apps.googleusercontent.com">

  <!-- Required by google_maps_flutter's web implementation. Uses the same
       "Websites"-restricted browser key as the dispatcher dashboard — add
       your local dev origin (e.g. http://localhost/*) to that key's allowed
       referrers in Google Cloud Console, since `flutter run -d chrome` uses
       a random port each run. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDQkuZRpbwNofReXUw9CLrDW6kW-8ln8UU"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
